[project]
name = "jobradar"
version = "0.1.0"
description = "Tracks senior marketing/brand/strategy vacancies on Djinni, Work.ua and Robota.ua, scores them against a profile and sends the good ones to Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.70",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
